[project]
name = "book"
version = "0.1.0"
description = "Python environment for rendering this Quarto book."
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyter-cache>=1.0.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
]

# `package = false` means this project is a place to run code, not a library to
# be built and installed. Without it, `uv sync` tries to build the folder as a
# Python package and fails, because there is no `src/` layout here.
[tool.uv]
package = false
